services:
  rdgen:
    # Image is built locally from this (reviewed) fork instead of pulling
    # the upstream author's prebuilt image bryangerlach/rdgen:latest.
    build: .
    restart: unless-stopped
    environment:
      # Generate with: python3 -c 'import secrets; print(secrets.token_hex(64))'
      SECRET_KEY: "change_me"
      GHUSER: "github_username"
      GHBEARER: "github_access_token"
      GENURL: "accessible_url_of_server"
      # Must match the GitHub secret ZIP_PASSWORD
      ZIP_PASSWORD: ""
      # Must match the GitHub secret UPLOAD_TOKEN (uploads/status/cleanup are rejected while empty)
      UPLOAD_TOKEN: ""
      GHBRANCH: "master"
      PROTOCOL: "https"
      REPONAME: "rdgen"
      # Only needed for a self-hosted Windows runner; leave empty otherwise
      SH_SECRET: ""
    ports:
      # Bound to localhost; expose it through a TLS reverse proxy
      - "127.0.0.1:8000:8000"
    volumes:
      - ./exe:/opt/rdgen/exe
      - ./png:/opt/rdgen/png
      - ./temp_zips:/opt/rdgen/temp_zips
